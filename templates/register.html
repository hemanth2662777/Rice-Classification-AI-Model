<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Create your GrainPalette AI account and access AI-powered grain classification."
    />

    <title>Create Account | GrainPalette AI</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/register.css') }}"
    />
  </head>

  <body class="auth-body">
    <main class="register-page">
      <section class="register-container">
        <div class="register-header">
          <div class="brand-icon" aria-hidden="true">🌾</div>

          <h1>Create Account</h1>

          <p>
            Join GrainPalette AI and unlock your AI-powered grain analysis
            experience.
          </p>
        </div>

        <form
          method="POST"
          action="{{ url_for('register') }}"
          class="register-form"
          id="registerForm"
        >
          <div class="form-row">
            <div class="form-group">
              <label for="first_name"> First Name </label>

              <div class="input-wrapper">
                <span class="input-icon" aria-hidden="true">
                  <svg
                    viewBox="0 0 24 24"
                    width="18"
                    height="18"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M20 21a8 8 0 0 0-16 0"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                </span>

                <input
                  class="input"
                  type="text"
                  id="first_name"
                  name="first_name"
                  placeholder="First name"
                  autocomplete="given-name"
                />
              </div>
            </div>

            <div class="form-group">
              <label for="last_name"> Last Name </label>

              <div class="input-wrapper">
                <span class="input-icon" aria-hidden="true">
                  <svg
                    viewBox="0 0 24 24"
                    width="18"
                    height="18"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M20 21a8 8 0 0 0-16 0"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                </span>

                <input
                  class="input"
                  type="text"
                  id="last_name"
                  name="last_name"
                  placeholder="Last name"
                  autocomplete="family-name"
                />
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="username"> Username </label>

            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  width="18"
                  height="18"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M20 21a8 8 0 0 0-16 0"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </span>

              <input
                class="input"
                type="text"
                id="username"
                name="username"
                placeholder="Choose a username"
                autocomplete="username"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="email"> Email Address </label>

            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  width="18"
                  height="18"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                  <path d="m3 7 9 6 9-6"></path>
                </svg>
              </span>

              <input
                class="input"
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
              />
            </div>
          </div>

          <div class="form-group">
            <label for="password"> Password </label>

            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  width="18"
                  height="18"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="4" y="10" width="16" height="11" rx="2"></rect>
                  <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                </svg>
              </span>

              <input
                class="input"
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                autocomplete="new-password"
                minlength="6"
                required
              />

              <button
                type="button"
                class="password-toggle"
                onclick="togglePassword('password', this)"
                aria-label="Show password"
              >
                <svg
                  viewBox="0 0 24 24"
                  width="18"
                  height="18"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"
                  ></path>
                  <circle cx="12" cy="12" r="2.5"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="confirm_password"> Confirm Password </label>

            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  width="18"
                  height="18"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="4" y="10" width="16" height="11" rx="2"></rect>
                  <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                </svg>
              </span>

              <input
                class="input"
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm your password"
                autocomplete="new-password"
                minlength="6"
                required
              />

              <button
                type="button"
                class="password-toggle"
                onclick="togglePassword('confirm_password', this)"
                aria-label="Show password"
              >
                <svg
                  viewBox="0 0 24 24"
                  width="18"
                  height="18"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"
                  ></path>
                  <circle cx="12" cy="12" r="2.5"></circle>
                </svg>
              </button>
            </div>
          </div>

          <label class="terms-checkbox">
            <input type="checkbox" name="terms" required />

            <span class="checkmark"></span>

            <span class="terms-text">
              I agree to the
              <a href="#">Terms of Service</a>
              and
              <a href="#">Privacy Policy</a>.
            </span>
          </label>

          {% if error %}
          <div class="error" role="alert">{{ error }}</div>
          {% endif %}

          <button type="submit" class="register-button">
            <span>Create Account</span>

            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12h14"></path>
              <path d="m13 6 6 6-6 6"></path>
            </svg>
          </button>
        </form>

        <div class="divider">
          <span>Already have an account?</span>
        </div>

        <a href="{{ url_for('login') }}" class="login-link">
          Sign in to GrainPalette AI
        </a>

        <p class="security-note">
          <span aria-hidden="true">🔒</span>
          Your account information is securely protected.
        </p>
      </section>
    </main>

    <script>
      function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);

        if (input.type === "password") {
          input.type = "text";
          button.setAttribute("aria-label", "Hide password");
        } else {
          input.type = "password";
          button.setAttribute("aria-label", "Show password");
        }
      }

      document
        .getElementById("registerForm")
        .addEventListener("submit", function (event) {
          const password = document.getElementById("password");
          const confirmPassword = document.getElementById("confirm_password");

          if (password.value !== confirmPassword.value) {
            event.preventDefault();
            alert("Passwords do not match.");
            confirmPassword.focus();
          }
        });
    </script>
  </body>
</html>
